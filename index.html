<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- スマホ表示に必須。viewport-fit=cover はノッチ周りの余白（env(safe-area-inset-*)）を
         CSS から使えるようにするために要る -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="Googleスプレッドシートに記録する家計簿" />

    <!-- ホーム画面に追加したときアドレスバー無しの単体アプリとして起動させる（iOS 用） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="家計簿" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.json" />
    <title>細矢さん 家計簿</title>
  </head>
  <body>
    <noscript>このアプリを実行するにはJavaScriptを有効にする必要があります。</noscript>
    <div id="root"></div>

    <!-- ▼▼▼ ★★★Google API Client Libraryを読み込むためのスクリプト★★★ ▼▼▼ -->
    <!-- アプリ本体は type="module"（defer 相当）なので、同期読み込みのこのスクリプトが必ず先に実行される。
         App が window.gapi を参照できるのはそのため。async / defer を足さないこと -->
    <script src="https://apis.google.com/js/api.js"></script>
    <!-- ▲▲▲ ★★★このスクリプトはアプリが動作するために不可欠です★★★ ▲▲▲ -->

    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
